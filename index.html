<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Fractal - O Norte e a Trincheira</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Container Principal usando CSS Grid -->
    <div class="dashboard-container">
        
        <!-- PAINEL ESQUERDO: A Bússola -->
        <aside class="bussola-panel">
            <h2>NORTE DE LONGO PRAZO</h2>
            <p style="color: #64748b; font-size: 0.9rem;">Árvore de metas entrará aqui...</p>
        </aside>

        <!-- PAINEL DIREITO: A Trincheira -->
        <main class="trincheira-panel">
            <h1>HOJE: QUARTA-FEIRA</h1>
            <div class="grid-temperaturas">
                <!-- Coluna Principal (Tempo A) -->
                <div class="coluna-a">
                    <h3 style="color: #ef4444;">TEMPO A - QUENTE</h3>
                    <p style="color: #64748b; font-size: 0.9rem;">Tarefas de foco total entrarão aqui...</p>
                </div>
                <!-- Coluna Secundária (Tempo B e C) -->
                <div class="coluna-bc">
                    <h3 style="color: #f97316;">TEMPO B - MORNO</h3>
                    <br>
                    <h3 style="color: #3b82f6;">TEMPO C - FRIO</h3>
                </div>
            </div>
        </main>

    </div>

    <script src="app.js"></script>
</body>
</html>
